<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Futbol</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#15171e; --card:#1d2029; --card2:#262a36; --line:#343947;
    --text:#f4f1f2; --muted:#9ea2b1; --blue:#dc4a5f; --blue2:#b8263f;
    --green:#22c55e; --amber:#f59e0b; --red:#ef4444;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
    background:radial-gradient(900px 500px at 50% -10%,#3d1d29 0%,var(--bg) 60%)}
  #app{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;padding:14px 14px 100px}
  button{font:inherit;color:inherit;border:0;cursor:pointer}

  .top{display:flex;align-items:center;gap:12px;margin-bottom:14px;position:relative;z-index:30}
  .langbox{position:relative;flex:none}
  .langbtn{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card2),var(--card));color:var(--text);font-family:inherit;font-weight:700;font-size:12px;line-height:1;letter-spacing:.06em;cursor:pointer;transition:border-color .15s,transform .1s}
  .langbtn svg{color:var(--blue)}
  .langbtn:active{transform:scale(.96)}
  .langbtn.on{border-color:var(--blue)}
  .langmenu{position:absolute;right:0;top:46px;min-width:176px;padding:6px;border-radius:16px;background:var(--card2);border:1px solid var(--line);box-shadow:0 14px 34px rgba(0,0,0,.5);animation:langin .16s ease-out;transform-origin:top right}
  @keyframes langin{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}
  .langopt{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;border-radius:11px;background:transparent;color:var(--text);font-family:inherit;font-weight:500;font-size:14px;line-height:1.2;text-align:left;cursor:pointer}
  .langopt:active{background:rgba(255,255,255,.06)}
  .langopt.on{background:rgba(220,74,95,.14)}
  .lcode{flex:none;width:30px;height:24px;display:grid;place-items:center;border-radius:7px;background:var(--card);border:1px solid var(--line);font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
  .langopt.on .lcode{background:var(--blue);border-color:var(--blue);color:#fff}
  .lname{flex:1}
  .lchk{color:var(--blue);font-weight:800}
  .avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#dc4a5f,#f0a35e);
    display:grid;place-items:center;font-weight:700;font-size:18px;overflow:hidden;flex:none}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .top .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .logo{flex:none;display:block;width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid rgba(224,84,106,.55);box-shadow:0 4px 16px rgba(190,40,70,.35)}
  .league{font-size:20px;font-weight:800;letter-spacing:.2px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .hero{background:linear-gradient(135deg,#4d202f 0%,#33212d 45%,#23272f 100%);border-color:#6f2f40}
  .label{font-size:12px;color:#f2adb8;letter-spacing:.4px;text-transform:uppercase;font-weight:600}
  .title{font-size:20px;font-weight:800;margin:6px 0 4px}
  .meta{display:flex;flex-direction:column;gap:6px;margin:10px 0;color:#f1e1e4;font-size:14px}
  .count{display:flex;gap:8px;margin:12px 0}
  .count div{flex:1;background:rgba(0,0,0,.28);border-radius:12px;padding:8px 0;text-align:center}
  .count b{display:block;font-size:20px}
  .count small{font-size:10px;color:#f2adb8}

  .bar{position:relative;height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:10px 0 6px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#f0a35e);border-radius:99px;transition:width .3s}
  .barrow{display:flex;justify-content:space-between;font-size:12px;color:#e6ccd2}

  .btn{width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:16px;
    background:linear-gradient(180deg,#ee6277,var(--blue2));box-shadow:0 4px 0 #8c1f32;margin-top:8px}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8c1f32}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.out{background:transparent;border:1px solid #ef444477;color:#ff8a8a;box-shadow:none}
  .btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line)}
  .btn.sm{width:auto;padding:10px 12px;font-size:13px;margin:0;border-radius:10px;box-shadow:none}
  .btnrow{display:flex;gap:8px;margin-top:12px}
  .btnrow .btn.sm{flex:1;text-align:center}

  h3{margin:18px 2px 10px;font-size:17px}
  .sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 10px}
  .sec-h h3{margin:0}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .g-title{font-weight:700}
  .g-sub{color:var(--muted);font-size:13px;margin-top:3px;word-break:break-word}
  .contact{font-size:12px;color:#f2adb8;margin-top:3px;word-break:break-all}
  .maplink{color:#ff94a3;text-decoration:underline;cursor:pointer}
  .datebox{width:52px;flex:none;text-align:center;background:var(--card2);border-radius:12px;padding:6px 0;border:1px solid var(--line)}
  .datebox b{display:block;font-size:20px;line-height:1.1}
  .datebox small{font-size:11px;color:var(--muted);text-transform:uppercase}
  .tag{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:700;display:inline-block;white-space:nowrap}
  .tag.ok{background:#22c55e22;color:#4ade80}
  .tag.wait{background:#f59e0b22;color:#fbbf24}
  .tag.full{background:#ef444422;color:#f87171}
  .link{cursor:pointer}

  .back{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:12px;font-size:14px}
  .player{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .player:last-child{border-bottom:0}
  .num{width:26px;text-align:center;color:var(--muted);font-weight:700;font-size:13px;padding-top:8px}
  .pav{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .xbtn{flex:none;width:34px;height:34px;border-radius:10px;background:#3a1620;color:#ff8a8a;font-size:13px}
  .me{color:var(--blue)}
  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
  .empty .big{font-size:40px;margin-bottom:8px}

  .stats{display:flex;gap:10px}
  .stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat{flex:1;text-align:center;background:var(--card2);border-radius:14px;padding:14px 6px}
  .stat b{font-size:24px;display:block}
  .stats3 .stat b{font-size:22px}
  .stat small{color:var(--muted);font-size:12px}


  /* admin menyu ro'yxati */
  .sec-l{font-size:20px;font-weight:800;margin:6px 2px 10px}
  .menu{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:16px}
  .li{display:flex;align-items:center;gap:14px;padding:14px;border-bottom:1px solid var(--line);cursor:pointer}
  .li:last-child{border-bottom:0}
  .li:active{background:var(--card2)}
  .li-ic{width:44px;height:44px;flex:none;border-radius:12px;background:#3d2432;display:grid;place-items:center;font-size:21px}
  .li-t{font-weight:700;font-size:16px}
  .li-s{color:var(--muted);font-size:13px;margin-top:2px}
  .chev{color:var(--muted);font-size:24px;line-height:1;flex:none}

  /* forma */
  input[type=text],input[type=tel],input[type=email],input[type=url],input[type=number],input[type=date],input[type=time]{
    width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);
    font:inherit;font-size:16px;outline:none;color-scheme:dark;min-width:0}
  input:focus{border-color:var(--blue)}
  .field-l{font-size:12px;color:var(--muted);margin:14px 0 6px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .note{font-size:13px;color:#fbbf24;background:#f59e0b14;border:1px solid #f59e0b44;border-radius:10px;padding:8px 10px;margin:0 0 12px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
  .opt .ic{font-size:26px;display:block;margin-bottom:6px}
  .opt b{display:block;font-size:14px}
  .opt small{color:var(--muted);font-size:12px}
  .opt.on{border-color:var(--blue);background:#52222f}
  .mrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .mrow input{flex:1;min-width:0}
  .capbtn{flex:none;width:48px;height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:18px;opacity:.45}
  .capbtn.on{opacity:1;background:#3d3210;border-color:#f59e0b99}
  .hint{font-size:12px;color:var(--muted);margin:6px 0 4px}
  .adm-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .adm-row:last-child{border-bottom:0}

  /* kalendar */
  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-h b{font-size:16px}
  .cal-h button{background:var(--card2);border:1px solid var(--line);width:36px;height:36px;border-radius:10px;font-size:16px}
  .cal-h button:disabled{opacity:.3;cursor:default}
  .cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .cal-w{font-size:11px;color:var(--muted);padding:4px 0}
  .cal-d{aspect-ratio:1;display:grid;place-items:center;font-size:14px;border-radius:10px;border:1px solid transparent}
  .cal-d.today{border-color:var(--blue)}
  .cal-d.game{background:#52222f;color:#ffdfe4;font-weight:700;cursor:pointer}
  .cal-d.reg{background:#14532d;color:#86efac}
  .cal-d.add{border:1px dashed #82404f;color:#cc909b;cursor:pointer}
  .legend{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

  nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));
    width:calc(100% - 24px);max-width:456px;background:#191b23ee;backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:22px;display:flex;padding:6px;gap:4px;z-index:5}
  nav button{flex:1;background:transparent;padding:8px 0;border-radius:16px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap;min-width:0}
  nav button span{font-size:20px;line-height:1}
  nav button.on{background:#3d2432;color:#ff94a3}

  .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#262a36;border:1px solid var(--line);
    padding:10px 16px;border-radius:12px;font-size:14px;z-index:100;animation:fade .2s;max-width:90%;text-align:center}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* kichik telefonlar */
  @media (max-width:360px){
    #app{padding:12px 10px 96px}
    .title{font-size:18px}
    .league{font-size:18px}
    .count b{font-size:17px}
    .btn{font-size:15px;padding:13px}
    nav button{font-size:10px}
    nav button span{font-size:18px}
    .datebox{width:46px}
    .cal-d{font-size:13px}
    .opt{padding:12px 6px}
    .stats3 .stat b{font-size:19px}
  }
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>

<script>
/* ---------- Sozlamalar ---------- */
// Server (Cloudflare Worker) manzili. Server joylashtirilgach shu yerga yoziladi.
const API_BASE = 'https://riga-sp-api.bilolpm111.workers.dev';
const TEAM_SIZE = 7;      // bitta jamoada 7 o'yinchi
const MAX_WEEKS = 12;     // kalendarda necha hafta oldinga o'tish mumkin
const POLL_MS = 45000;    // ma'lumot qanchada bir yangilanadi

/* ---------- Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#15171e'); tg.setBackgroundColor('#15171e'); } catch (e) {}
}
const tu = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const INIT = (tg && tg.initData) || '';
const MY_NAME = tu ? [tu.first_name, tu.last_name].filter(Boolean).join(' ') : '';
const MY_PHOTO = tu && tu.photo_url ? tu.photo_url : '';
const PROF_KEY = 'rsp_profile_' + (tu ? tu.id : 'guest');
function loadProf() {
  try { const o = JSON.parse(localStorage.getItem(PROF_KEY) || '{}'); return { name: o.name || '', phone: o.phone || '', email: o.email || '' }; }
  catch (e) { return { name: '', phone: '', email: '' }; }
}
function saveProf(o) { try { localStorage.setItem(PROF_KEY, JSON.stringify(o)); return true; } catch (e) { return false; } }
/* Yozilgan o'yinlar tarixi: serverda ko'rinmay qolgan eski o'yinlar ham shu qurilmada saqlanadi */
const HIST_KEY = 'rsp_hist_' + (tu ? tu.id : 'guest');
function loadHist() { try { const a = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function saveHist(a) { try { localStorage.setItem(HIST_KEY, JSON.stringify(a.slice(0, 300))); } catch (e) {} }
function syncHist() {
  if (!state.me || !tu) return;
  const h = loadHist(), ids = new Set(state.games.map(g => g.id));
  const cut = Date.now() - 8 * 86400000;                 // server shundan eski o'yinlarni qaytarmaydi
  const out = h.filter(x => !ids.has(x.id) && x.ts < cut);   // faqat eskirgan o'yinlar saqlanadi; adminlar o'chirganlari yo'qoladi
  state.games.forEach(g => {
    const p = g.players.find(q => q.mine); if (!p) return;  // bekor qilingan bo'lsa tarixdan chiqadi
    out.push({ id: g.id, ts: g.ts, title: g.title, place: g.place, mapUrl: g.mapUrl, kind: p.kind, name: p.name, members: p.members || [], captain: p.captain, waiting: !!p.waiting });
  });
  saveHist(out);
}
const profile = loadProf();                              // Profil sozlamalari (shu qurilmada saqlanadi)
const shownName = () => profile.name || MY_NAME;
const nick = () => profile.name ? profile.name : (tu ? (tu.username ? '@' + tu.username : MY_NAME) : '');

/* ---------- Til: uz / en / ru ---------- */
const LANGS = [['uz', "O'zbekcha", 'UZ'], ['en', 'English', 'EN'], ['ru', 'Русский', 'RU']];
const LANG_KEY = 'rsp_lang';

  uz: ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'],
  en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  ru: ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря']
};
const MON_SHORT_RU = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const dayName = i => DAYS_L[LANG][i];
const weekdays = () => WD_L[LANG];
const monShort = i => LANG === 'ru' ? MON_SHORT_RU[i] : MONTHS_L[LANG][i].slice(0, 3);
// "22-noyabr" | "Nov 22" | "22 ноября"
const dm = (day, mi) => LANG === 'en' ? `${MONTHS_L.en[mi]} ${day}` : LANG === 'ru' ? `${day} ${MONTHS_L.ru[mi]}` : `${day}-${MONTHS_L.uz[mi]}`;
const gTitle = g => (!g.title || g.title === "Futbol o'yini") ? t("Futbol o'yini") : g.title;
function setLang(l) {
  LANG = l; try { localStorage.setItem(LANG_KEY, l); } catch (e) {}

/* ---------- Yordamchilar ---------- */
const pad = n => String(n).padStart(2, '0');
const initial = s => (Array.from(String(s || '').trim())[0] || '?').toUpperCase();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = ts => { const d = new Date(ts); return `${dayName(d.getDay())}, ${dm(d.getDate(), d.getMonth())}`; };
const fmtTime = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const mondayOf = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };
const nextSaturday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); while (d.getDay() !== 6) d.setDate(d.getDate() + 1); return d; };
const haptic = () => { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} };
const okPhone = s => /^\+?[0-9 ()-]{7,20}$/.test(String(s).trim());
const okEmail = s => /^\S+@\S+\.\S+$/.test(String(s).trim());

  tab: 'games',        // games | mine | profile | admin
  open: null,          // ochilgan o'yin (ro'yxat)
  form: null,          // ro'yxatdan o'tish formasi
  aform: null,         // admin: o'yin qo'shish/tahrirlash formasi
  profView: null,      // profil: null | edit
  pform: null,
  allGames: false,     // admin Yozilganlar: hammasini ko'rsatish
  adminView: null,     // admin menyusi: null | games | players | stats | admins
  newAdmin: { uid: '', name: '' },
  langOpen: false,     // til tanlash menyusi
  week: 0
};
const isAdmin = () => !!state.me && (state.me.role === 'admin' || state.me.role === 'owner');
const isOwner = () => !!state.me && state.me.role === 'owner';
const upcoming = () => state.games.filter(g => g.ts > Date.now()).sort((a, b) => a.ts - b.ts);
const byId = id => state.games.find(g => g.id === id);
const myReg = g => g.players.find(p => p.mine);
const isReg = g => !!myReg(g);
const statusOf = g => { const p = myReg(g); return !p ? null : (p.waiting ? 'wait' : 'ok'); };
const freeOf = g => Math.max(0, g.capacity - g.used);

/* ---------- Server bilan aloqa ---------- */
async function api(path, body) {
  if (!API_BASE) throw new Error(t('Server manzili sozlanmagan'));
  const opts = { headers: {} };
  if (INIT) opts.headers['X-Init-Data'] = INIT;
  if (body !== undefined) {
    opts.method = 'POST';
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  let r, j = null;
  try { r = await fetch(API_BASE + path, opts); }
  catch (e) { throw new Error(t("Server bilan aloqa yo'q. Internetni tekshiring.")); }
  try { j = await r.json(); } catch (e) {}
  if (!r.ok || !j || j.ok === false) {
    const err = new Error(j && j.error ? srvErr(j.error) : t('Xatolik yuz berdi'));
    err.status = r.status;
    throw err;
  }
  return j;
}
let rev = 0;   // har bir yangi holat olinganda oshadi: eskirgan javob yangisini bosib ketmasin
function applyState(s) {
  rev++;
  state.me = s.me; state.games = s.games; state.admins = s.admins || [];
  state.loaded = true; state.error = '';
  syncHist();
}
const isEditing = () => !!(state.form || state.aform || state.pform) ||
  !!(document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
async function refresh(silent) {
  const my = rev;
  try { const r = await api('/api/state'); if (rev !== my) return; applyState(r.state); }
  catch (e) {
    if (!state.loaded) state.error = e.message;
    else if (!silent) toast(e.message);
    else return;
  }
  if (silent && isEditing()) return;   // yozayotgan paytda ekranni buzmaymiz
  render();
}
// O'zgartiruvchi amal: serverga yuboradi, javobdagi yangi holatni oladi
async function act(path, body, okMsg) {
  if (state.busy) return false;
  state.busy = true;
  try {
    const r = await api(path, body); applyState(r.state);
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    toast(e.message || t('Xatolik'));
    return false;
  } finally { state.busy = false; }
}

const avatarHtml = () => `<div class="avatar">${MY_PHOTO ? `<img src="${esc(MY_PHOTO)}">` : (MY_NAME ? esc(initial(MY_NAME)) : '👤')}</div>`;
const GLOBE = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4"/><path d="M12 2.8c2.6 2.5 4 5.7 4 9.2s-1.4 6.7-4 9.2c-2.6-2.5-4-5.7-4-9.2s1.4-6.7 4-9.2z"/></svg>`;
function langHtml() {
  const cur = LANGS.find(l => l[0] === LANG) || LANGS[0];
  const menu = state.langOpen ? `<div class="langmenu" role="menu">${LANGS.map(l => `<button class="langopt ${l[0] === LANG ? 'on' : ''}" data-a="setlang" data-id="${l[0]}" role="menuitem">
      <span class="lcode">${l[2]}</span><span class="lname">${l[1]}</span><span class="lchk">${l[0] === LANG ? '✓' : ''}</span></button>`).join('')}</div>` : '';
  return `<div class="langbox"><button class="langbtn ${state.langOpen ? 'on' : ''}" data-a="lang" aria-label="Language" aria-expanded="${state.langOpen}">${GLOBE}<span>${cur[2]}</span></button>${menu}</div>`;
}
function topHtml() {
  return `<div class="top">${LOGO}<div class="grow"><div class="league">${t('Riga Street Power Liga')}</div>${nick() ? `<div class="sub">${esc(nick())}</div>` : ''}</div>${langHtml()}</div>`;
}
function progress(g) {
  // Oddiy o'yinchiga umumiy son va boshqalar ko'rsatilmaydi, faqat bo'sh joy
  if (!isAdmin()) return `<div class="barrow" style="margin:10px 0 4px"><span>${freeOf(g) > 0 ? t("{n} ta bo'sh joy", { n: freeOf(g) }) : t('Joy qolmagan (navbatga yozilasiz)')}</span></div>`;
  const pct = Math.min(100, g.used / g.capacity * 100);
  return `<div class="bar"><i style="width:${pct}%"></i></div>
    <div class="barrow"><span>${t("{a}/{b} o'yinchi", { a: g.used, b: g.capacity })}</span><span>${g.waiting ? t('{n} kishi navbatda', { n: g.waiting }) : t("{n} ta bo'sh joy", { n: freeOf(g) })}</span></div>`;
}
function placeHtml(g) {
  const pl = g.place ? esc(g.place) : t("Joy keyin e'lon qilinadi");
  return g.place && g.mapUrl ? `<span class="maplink" data-a="map" data-id="${g.id}">${pl}</span>` : pl;
}
const metaHtml = g => `<div class="meta"><span>📅 ${fmtDate(g.ts)}</span><span>🕗 ${fmtTime(g.ts)}</span><span>📍 ${placeHtml(g)}</span></div>`;
function actionBtn(g) {
  if (isAdmin()) return '';   // adminlar o'yinga yozilmaydi, faqat boshqaradi
  if (g.ts <= Date.now()) return `<button class="btn ghost" disabled>${t("O'yin o'tgan")}</button>`;
  return isReg(g)
    ? `<button class="btn out" data-a="cancel" data-id="${g.id}">${t("Ro'yxatdan chiqish")}</button>`
    : `<button class="btn" data-a="reg" data-id="${g.id}">${t("Ro'yxatdan o'tish")}</button>`;
}
function badge(g) {
  if (g.ts <= Date.now()) return `<span class="tag full">${t("O'tgan")}</span>`;
  const s = statusOf(g);
  if (s === 'ok') return `<span class="tag ok">${t("Yozildingiz")}</span>`;
  if (s === 'wait') return `<span class="tag wait">${t("Navbatda")}</span>`;
  return freeOf(g) === 0 ? `<span class="tag full">${t("To'lgan")}</span>` : '';
}

/* ---------- Hafta va kalendar ---------- */
const weekStart = () => { const d = mondayOf(Date.now()); d.setDate(d.getDate() + state.week * 7); return d; };
function weekGames() {
  const s = weekStart(), e = new Date(s); e.setDate(e.getDate() + 7);
  return state.games.filter(g => g.ts >= s.getTime() && g.ts < e.getTime()).sort((a, b) => a.ts - b.ts);
}
function weekNav() {
  const s = weekStart(), e = new Date(s); e.setDate(e.getDate() + 6);
  const sm = s.getMonth(), em = e.getMonth();
  const range = sm === em
    ? (LANG === 'en' ? `${MONTHS_L.en[sm]} ${s.getDate()}–${e.getDate()}` : `${s.getDate()}–${dm(e.getDate(), em)}`)
    : `${dm(s.getDate(), sm)} – ${dm(e.getDate(), em)}`;
  const name = state.week === 0 ? t('Shu hafta') : state.week === 1 ? t('Keyingi hafta') : t('{n} hafta keyin', { n: state.week });
  return `<div class="cal-h"><button data-a="wk" data-id="-1" ${state.week <= 0 ? 'disabled' : ''}>‹</button>
    <div style="text-align:center"><b>${name}</b><div class="g-sub" style="margin:2px 0 0">${range}</div></div>
    <button data-a="wk" data-id="1" ${state.week >= MAX_WEEKS ? 'disabled' : ''}>›</button></div>`;
}
function calendarHtml() {
  const s = weekStart(), now = new Date(), gs = weekGames(), adm = isAdmin();
  let cells = weekdays().map(w => `<div class="cal-w">${w}</div>`).join('');
  for (let i = 0; i < 7; i++) {
    const d = new Date(s); d.setDate(d.getDate() + i);
    const g = gs.find(x => new Date(x.ts).toDateString() === d.toDateString());
    const today = d.toDateString() === now.toDateString();
    const notPast = d.getTime() + 86400000 > now.getTime();
    const cls = 'cal-d' + (today ? ' today' : '') + (g ? (isReg(g) ? ' game reg' : ' game') : '');
    if (g) cells += `<div class="${cls}" data-a="open" data-id="${g.id}">${d.getDate()}</div>`;
    else if (adm && notPast) cells += `<div class="${cls} add" data-a="newgame" data-id="${ymd(d)}">${d.getDate()}</div>`;
    else cells += `<div class="${cls}">${d.getDate()}</div>`;
  }
  return `<h3>${t("Kalendar")}</h3><div class="card">
    ${weekNav()}
    <div class="cal-g">${cells}</div>
    <div class="legend"><span><i style="background:#52222f"></i>${t("O'yin kuni")}</span><span><i style="background:#14532d"></i>${t("Siz yozilgansiz")}</span><span><i style="border:1px solid var(--blue)"></i>${t("Bugun")}</span></div>
    ${adm ? `<div class="hint">${t("Admin: bo'sh kunni bossangiz, shu kunga yangi o'yin qo'shiladi.")}</div>` : ''}
  </div>`;
}

      <div class="grow"><div class="g-title">${dayName(d.getDay())}, ${fmtTime(g.ts)}</div>
        <div class="g-sub">📍 ${g.place ? esc(g.place) : t('Joy kiritilmagan')}</div>
        <div class="g-sub">${t("{a}/{b} o'yinchi", { a: g.used, b: g.capacity })} · ${t("{n} ta bo'sh joy", { n: freeOf(g) })}</div></div></div>
      <div class="btnrow">
        <button class="btn ghost sm" data-a="open" data-id="${g.id}">👥 ${t("Ro'yxat")}</button>
        <button class="btn ghost sm" data-a="editgame" data-id="${g.id}">✏️ ${t("Tahrirlash")}</button>
        <button class="btn out sm" data-a="delgame" data-id="${g.id}">🗑</button></div></div>`;
  }).join('') : `<div class="empty"><div class="big">📅</div>${t("Hali o'yin qo'shilmagan.")}</div>`;
  return admHead(t("O'yinlar")) + `<button class="btn" data-a="newgame" data-id="" style="margin:0 0 12px">${t("+ Yangi o'yin")}</button>` + list;
}

function viewAdmPlayers() {
  const up = upcoming();
  const blocks = up.map(g => `<div class="sec-h"><h3 style="font-size:15px">${fmtDate(g.ts)}, ${fmtTime(g.ts)}</h3><span class="g-sub" style="margin:0">${g.used}/${g.capacity}</span></div>
    <div class="card">${g.players.length ? g.players.map((p, i) => playerRow(p, i, true)).join('') : `<div class="g-sub">${t("Hali hech kim yozilmagan.")}</div>`}</div>`).join('');
  return admHead(t("Ro'yxatdan o'tganlar")) + (blocks || `<div class="empty"><div class="big">📅</div>${t("Hali o'yin qo'shilmagan.")}</div>`);
}

function viewAdmStats() {
  const up = upcoming();
  const sum = f => up.reduce((a, g) => a + f(g), 0);
  const tiles = `<div class="stats3">
    <div class="stat"><b>${up.length}</b><small>${t("O'yinlar")}</small></div>
    <div class="stat"><b>${sum(g => g.used)}</b><small>${t("O'yinchilar")}</small></div>
    <div class="stat"><b>${sum(g => freeOf(g))}</b><small>${t("Bo'sh joy")}</small></div>
    <div class="stat"><b>${sum(g => gameCount(g, 'team'))}</b><small>${t("Jamoalar")}</small></div>
    <div class="stat"><b>${sum(g => gameCount(g, 'solo'))}</b><small>${t("Yakkalar")}</small></div>
    <div class="stat"><b>${sum(g => g.waiting)}</b><small>${t("Navbatda")}</small></div></div>`;
  const per = up.map(g => `<div class="card"><div class="g-title">${fmtDate(g.ts)}, ${fmtTime(g.ts)}</div>${progress(g)}
    <div class="g-sub">${t('{n} jamoa', { n: gameCount(g, 'team') })} · ${t('{n} yakka', { n: gameCount(g, 'solo') })}${g.waiting ? ` · ${t('{n} kishi navbatda', { n: g.waiting })}` : ''}</div></div>`).join('');
  return admHead(t('Statistika')) + tiles + (per ? `<h3>${t("Har bir o'yin")}</h3>${per}` : '');
}

function viewAdmAdmins() {
  return admHead(t('Adminlar')) + `<div class="card">
      ${state.admins.length ? state.admins.map(a => `<div class="adm-row"><div class="grow"><div class="g-title">${esc(a.name || t('Nomsiz'))}</div><div class="g-sub">ID: ${a.uid}</div></div>
        <button class="btn out sm" data-a="rmadmin" data-id="${a.uid}">${t("O'chirish")}</button></div>`).join('') : `<div class="g-sub">${t("Hozircha adminlar yo'q. Faqat siz (asoschi) borsiz.")}</div>`}</div>
    <h3>${t("Yangi admin qo'shish")}</h3><div class="card">
      <div class="field-l" style="margin-top:0">Telegram ID</div>
      <input type="text" inputmode="numeric" data-na="uid" maxlength="15" placeholder="${t('Masalan: 123456789')}" value="${esc(state.newAdmin.uid)}">
      <div class="field-l">${t("Ismi (ixtiyoriy)")}</div>
      <input type="text" data-na="name" maxlength="60" placeholder="${t("Masalan: Do'stim")}" value="${esc(state.newAdmin.name)}">
      <div class="hint">${t("Admin bo'ladigan odam Mini App'ni ochib, Profil sahifasidagi Telegram ID raqamini sizga yuborsin.")}</div>
      <button class="btn" data-a="addadmin">${t("Admin qo'shish")}</button></div>`;
}

/* Admin: o'yin qo'shish / tahrirlash formasi */
function viewAdminForm() {
  const f = state.aform, editing = !!f.id;
  return `<button class="back" data-a="aback">${t("← Orqaga")}</button>
    <div class="card"><div class="g-title">${editing ? t("O'yinni tahrirlash") : t("Yangi o'yin")}</div>
      <div class="row2">
        <div><div class="field-l">${t("Sana")}</div><input type="date" data-af="date" value="${esc(f.date)}"></div>
        <div><div class="field-l">${t("Boshlanish vaqti")}</div><input type="time" data-af="time" value="${esc(f.time)}"></div>
      </div>
      <div class="field-l">${t("Joy (lokatsiya nomi)")}</div>
      <input type="text" data-af="place" maxlength="120" placeholder="${t('Masalan: Imanta stadioni')}" value="${esc(f.place)}">
      <div class="field-l">${t("Xarita havolasi (ixtiyoriy)")}</div>
      <input type="url" data-af="mapUrl" maxlength="300" placeholder="https://maps.google.com/..." value="${esc(f.mapUrl)}">
      <div class="field-l">${t("O'yinchilar soni (sig'im)")}</div>
      <input type="number" inputmode="numeric" min="1" max="200" data-af="capacity" value="${esc(f.capacity)}">
      <div class="hint">${t('{n} × jamoalar soni. 3 jamoa = {a}, 4 jamoa = {b}.', { n: TEAM_SIZE, a: TEAM_SIZE * 3, b: TEAM_SIZE * 4 })}</div>
      <div class="field-l">${t("Sarlavha (ixtiyoriy)")}</div>
      <input type="text" data-af="title" maxlength="60" placeholder="${t("Futbol o'yini")}" value="${esc(f.title)}">
      <button class="btn" data-a="asave">${editing ? t('Saqlash') : t("O'yinni qo'shish")}</button>
    </div>`;
}

function render() {
  if (state.tab === 'admin') state.tab = 'profile';
  let html;
  if (!state.loaded) html = viewBoot();
  else if (state.aform) html = viewAdminForm();
  else if (state.form) html = viewForm();
  else if (state.tab === 'games') html = state.open ? viewDetail() : viewGames();
  else if (state.tab === 'mine') html = state.open ? viewDetail() : viewMine();
  else if (state.tab === 'profile') html = state.open ? (byId(state.open) ? viewDetail() : viewHistGame()) : viewProfile();
  else html = viewProfile();
  $app.innerHTML = html;
  const tabs = [['games', '⚽', t('Asosiy')], ['mine', '📝', t('Yozilganlar')], ['profile', '👤', t('Profil')]];
  $nav.innerHTML = tabs.map(x => `<button data-a="tab" data-id="${x[0]}" class="${state.tab === x[0] ? 'on' : ''}"><span>${x[1]}</span>${x[2]}</button>`).join('');
  tick();
}

function toast(m) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = m;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}
const canConfirm = tg && tg.showConfirm && (!tg.isVersionAtLeast || tg.isVersionAtLeast('6.2'));
function ask(msg, yes) {
  if (canConfirm) tg.showConfirm(msg, ok => { if (ok) yes(); });
  else if (window.confirm(msg)) yes();
}

/* ---------- Teskari sanoq ---------- */
function tick() {
  const el = document.getElementById('cd');
  if (!el) return;
  const ts = +el.dataset.ts;
  if (ts <= Date.now()) { render(); return; }   // o'yin boshlandi: asosiy karta keyingi o'yinga o'tadi
  let s = Math.floor((ts - Date.now()) / 1000);
  const d = Math.floor(s / 86400); s %= 86400;
  const h = Math.floor(s / 3600); s %= 3600;
  const m = Math.floor(s / 60); s %= 60;
  const v = [[d, t('kun')], [h, t('soat')], [m, t('daqiqa')], [s, t('soniya')]];
  el.innerHTML = v.map(x => `<div><b>${pad(x[0])}</b><small>${x[1]}</small></div>`).join('');
}
setInterval(tick, 1000);

/* ---------- Amallar ---------- */
document.addEventListener('input', e => {
  const d = e.target.dataset || {};
  if (d.f && state.form) {
    if (/^m\d$/.test(d.f)) state.form.members[+d.f.slice(1)] = e.target.value; else state.form[d.f] = e.target.value;
  } else if (d.af && state.aform) state.aform[d.af] = e.target.value;
  else if (d.na) state.newAdmin[d.na] = e.target.value;
  else if (d.pf && state.pform) state.pform[d.pf] = e.target.value;
});

async function submitForm() {
  const f = state.form;
  let body;
  if (f.type === 'solo') {
    if (f.name.trim().length < 2) return toast(t("Ismingizni kiriting"));
    if (!okPhone(f.phone)) return toast(t("Telefon raqamni to'g'ri kiriting"));
    if (!okEmail(f.email)) return toast(t("Email manzilni to'g'ri kiriting"));
    body = { gameId: f.gameId, kind: 'solo', name: f.name, phone: f.phone, email: f.email };
  } else if (f.type === 'team') {
    if (f.members.some(s => s.trim().length < 2)) return toast(t("{n} ta o'yinchining hammasini kiriting", { n: TEAM_SIZE }));
    if (!okPhone(f.phone)) return toast(t("Kapitanning telefon raqamini kiriting"));
    body = { gameId: f.gameId, kind: 'team', teamName: f.teamName, members: f.members, captain: f.captain, phone: f.phone };
  } else return toast(t("Avval tanlang: jamoa yoki yakka"));
  if (!(await act('/api/register', body))) return;
  const g = byId(f.gameId), wait = g && statusOf(g) === 'wait';
  state.form = null; state.open = null; state.tab = 'mine';
  render(); window.scrollTo(0, 0);
  toast(wait ? t('Navbatga yozildingiz') : t('Muvaffaqiyatli yozildingiz ✅'));
}

function openAdminForm(g, dateStr) {
  if (g) {
    state.aform = { id: g.id, date: ymd(new Date(g.ts)), time: fmtTime(g.ts), place: g.place, mapUrl: g.mapUrl, capacity: String(g.capacity), title: g.title === "Futbol o'yini" ? '' : g.title };
  } else {
    const last = [...state.games].sort((a, b) => b.ts - a.ts)[0];   // oxirgi o'yin ma'lumotlarini nusxalaymiz
    state.aform = { id: null, date: dateStr || ymd(nextSaturday()), time: last ? fmtTime(last.ts) : '20:00',
      place: last ? last.place : '', mapUrl: last ? last.mapUrl : '', capacity: String(last ? last.capacity : TEAM_SIZE * 4), title: '' };
  }
  render(); window.scrollTo(0, 0);
}

async function saveAdminForm() {
  const f = state.aform;
  if (!f.date || !f.time) return toast(t("Sana va vaqtni kiriting"));
  const [y, m, d] = f.date.split('-').map(Number), [hh, mm] = f.time.split(':').map(Number);
  const ts = new Date(y, m - 1, d, hh, mm, 0, 0).getTime();
  if (!Number.isFinite(ts)) return toast(t("Sana yoki vaqt noto'g'ri"));
  if (!f.id && ts <= Date.now()) return toast(t("Bu sana o'tib ketgan"));
  const cap = parseInt(f.capacity, 10);
  if (!(cap >= 1 && cap <= 200)) return toast(t("O'rinlar soni 1 dan 200 gacha bo'lsin"));
  const ok = await act('/api/admin/game', { id: f.id, ts, title: f.title, place: f.place, mapUrl: f.mapUrl, capacity: cap },
    f.id ? t('Saqlandi ✅') : t("O'yin qo'shildi ✅"));
  if (ok) { state.aform = null; render(); window.scrollTo(0, 0); }
}

document.addEventListener('click', async e => {
  if (state.langOpen && !e.target.closest('.langbox')) { state.langOpen = false; render(); }   // menyudan tashqariga bosilsa yopiladi
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a, id = el.dataset.id;
  haptic();
  if (a === 'lang') { state.langOpen = !state.langOpen; render(); }
  else if (a === 'setlang') { state.langOpen = false; setLang(id); render(); }
  else if (a === 'tab') { state.langOpen = false; state.tab = id; state.open = null; state.adminView = null; state.profView = null; state.pform = null; state.form = null; state.aform = null; render(); window.scrollTo(0, 0); }
  else if (a === 'open') { state.open = +id; render(); window.scrollTo(0, 0); }
  else if (a === 'back') { state.open = null; render(); }
  else if (a === 'allgames') { state.allGames = !state.allGames; render(); }
  else if (a === 'pgame') { state.open = +id; render(); window.scrollTo(0, 0); }
  else if (a === 'pedit') { state.profView = 'edit'; state.pform = { name: profile.name, phone: profile.phone, email: profile.email }; render(); window.scrollTo(0, 0); }
  else if (a === 'pback') { state.profView = null; state.pform = null; render(); }
  else if (a === 'psave') {
    const f = state.pform, name = f.name.trim(), phone = f.phone.trim(), email = f.email.trim();
    if (name && name.length < 2) return toast(t("Ism juda qisqa"));
    if (phone && !okPhone(phone)) return toast(t("Telefon raqamni to'g'ri kiriting"));
    if (email && !okEmail(email)) return toast(t("Email manzilni to'g'ri kiriting"));
    Object.assign(profile, { name, phone, email });
    if (!saveProf(profile)) return toast(t("Saqlab bo'lmadi"));
    state.profView = null; state.pform = null; render(); toast(t('Saqlandi ✅'));
  }
  else if (a === 'pclear') { Object.assign(profile, { name: '', phone: '', email: '' }); saveProf(profile); state.pform = { name: '', phone: '', email: '' }; render(); toast(t('Tozalandi')); }
  else if (a === 'copyid') {
    const txt = String(tu.id);
    try { navigator.clipboard.writeText(txt).then(() => toast(t('ID nusxalandi')), () => toast('ID: ' + txt)); } catch (e) { toast('ID: ' + txt); }
  }
  else if (a === 'adm') { state.adminView = id; render(); window.scrollTo(0, 0); }
  else if (a === 'admback') { state.adminView = null; render(); window.scrollTo(0, 0); }
  else if (a === 'retry') { state.error = ''; render(); refresh(false); }
  else if (a === 'map') { const g = byId(+id) || loadHist().find(h => h.id === +id); if (g && g.mapUrl) { if (tg && tg.openLink) tg.openLink(g.mapUrl); else window.open(g.mapUrl, '_blank', 'noopener'); } }
  else if (a === 'wk') { state.week = Math.min(MAX_WEEKS, Math.max(0, state.week + +id)); render(); }
  else if (a === 'reg') {
    if (!state.me) return toast(t("Telegram ichida oching, shunda ro'yxatdan o'tish mumkin"));
    state.form = { gameId: +id, type: null, name: shownName(), phone: profile.phone, email: profile.email, teamName: '', members: Array(TEAM_SIZE).fill(''), captain: 0 };
    render(); window.scrollTo(0, 0);
  }
  else if (a === 'fback') { state.form = null; render(); }
  else if (a === 'type') { state.form.type = id; if (id === 'team' && !state.form.members[0].trim()) state.form.members[0] = shownName(); render(); }
  else if (a === 'cap') { state.form.captain = +id; render(); }
  else if (a === 'confirm') await submitForm();
  else if (a === 'cancel') { if (await act('/api/cancel', { gameId: +id }, t("Ro'yxatdan chiqdingiz"))) render(); }
  /* admin */
  else if (a === 'newgame') openAdminForm(null, id || null);
  else if (a === 'editgame') { const g = byId(+id); if (g) openAdminForm(g); }
  else if (a === 'aback') { state.aform = null; render(); }
  else if (a === 'asave') await saveAdminForm();
  else if (a === 'delgame') ask(t("Bu o'yinni va unga yozilganlarning hammasini o'chirasizmi?"), async () => {
    if (await act('/api/admin/game/delete', { id: +id }, t("O'yin o'chirildi"))) { if (state.open === +id) state.open = null; render(); }
  });
  else if (a === 'delreg') ask(t("Bu yozuvni ro'yxatdan o'chirasizmi?"), async () => {
    if (await act('/api/admin/reg/delete', { id: +id }, t("Yozuv o'chirildi"))) render();
  });
  else if (a === 'addadmin') {
    const uid = state.newAdmin.uid.trim();
    if (!/^\d{5,15}$/.test(uid)) return toast(t("Telegram ID faqat raqamlardan iborat bo'lsin"));
    if (await act('/api/admin/admins/add', { uid: Number(uid), name: state.newAdmin.name }, t("Admin qo'shildi ✅"))) { state.newAdmin = { uid: '', name: '' }; render(); }
  }
  else if (a === 'rmadmin') ask(t("Bu adminni o'chirasizmi?"), async () => {
    if (await act('/api/admin/admins/remove', { uid: Number(id) }, t("Admin o'chirildi"))) render();
  });
});

/* ---------- Ishga tushirish ---------- */
setInterval(() => { if (!document.hidden) refresh(true); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
document.documentElement.lang = LANG; document.title = t('Riga Street Power Liga');
render();
refresh(false);
</script>
</body>
</html>
